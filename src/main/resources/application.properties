spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recursos}
spring.datasource.username=${DB_USER:recursos}
spring.datasource.password=${DB_PASSWORD:recursos-local}
spring.jackson.time-zone=UTC
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
app.admin-password=${ADMIN_PASSWORD:}
app.notification-url=${NOTIFICATION_URL:}
